apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: "[[node_role_name]]"
  subnetSelectorTerms:
  - tags:
      Name: "[[account_name]]-[[region_prefix]]-*-sbnt*-public-*"
  securityGroupSelectorTerms:
  - tags:
      Name: "[[account_name]]-[[region_prefix]]-*eks-nodes*"
  blockDeviceMappings:
  - deviceName: /dev/xvda
    ebs:
      volumeSize: 50Gi
      volumeType: gp3
      encrypted: true
      deleteOnTermination: true
  tags:
    ManagedBy: karpenter
    ClusterName: "[[cluster_name]]"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        managed-by: karpenter
        workload-type: general
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
      - key: karpenter.sh/capacity-type
        operator: In
        values: [ "on-demand", "spot" ]
      - key: karpenter.k8s.aws/instance-category
        operator: In
        values: [ "c", "m", "r" ]
      - key: kubernetes.io/arch
        operator: In
        values: [ "amd64" ]
  limits:
    cpu: "1000"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
